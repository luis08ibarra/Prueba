{% extends "base.html" %}
{% block title %}Contacto - Café Aroma{% endblock %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                <h2 class="fw-bold mb-3 text-center" style="color: #3B2418;">Contáctanos</h2>
                <p class="text-muted text-center mb-4">¿Tienes dudas sobre nuestros orígenes de café? Escríbenos.</p>
                <form>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Tu Nombre</label>
                        <input type="text" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Correo electrónico</label>
                        <input type="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Mensaje</label>
                        <textarea class="form-control" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-cafe w-100">Enviar Mensaje</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
