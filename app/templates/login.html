{% extends "base.html" %}
{% block title %}Iniciar Sesión - Café Aroma{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <h2 class="fw-bold" style="color: #3B2418;">Iniciar Sesión</h2>
                    <p class="text-muted small">Accede a tu cuenta en Café Aroma</p>
                </div>
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Correo electrónico</label>
                        <input type="email" name="correo" class="form-control" required placeholder="correo@ejemplo.com">
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Contraseña</label>
                        <input type="password" name="password" class="form-control" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-cafe w-100 py-2 shadow-sm mb-3">Ingresar</button>
                    <div class="text-center">
                        <small class="text-muted">¿No tienes una cuenta? <a href="{{ url_for('auth.registro') }}" class="text-decoration-none fw-bold" style="color: #6F4E37;">Regístrate aquí</a></small>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
