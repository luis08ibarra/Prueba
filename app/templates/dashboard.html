{% extends "base.html" %}
{% block title %}Panel Administrativo - Café Aroma{% endblock %}
{% block content %}
<div class="container my-4">
    <h1 class="fw-bold mb-4" style="color: #3B2418;"><i class="fa-solid fa-gauge me-2"></i> Panel de Administración</h1>
    
    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white text-center">
                <h3 class="fw-bold text-success">{{ total_productos }}</h3>
                <p class="text-muted mb-0">Productos Registrados</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white text-center">
                <h3 class="fw-bold text-primary">{{ total_pedidos }}</h3>
                <p class="text-muted mb-0">Pedidos Totales</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white text-center">
                <h3 class="fw-bold text-warning">{{ total_usuarios }}</h3>
                <p class="text-muted mb-0">Clientes Registrados</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
